name: Jarvis Iron CI

on:
  push:
    branches:
      - main
      - build/jarvis-v0
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Core and contract tests
        run: python -m pytest -q --ignore=tests/test_f3_playwright_integration.py --ignore=tests/test_f4_win32_integration.py --ignore=tests/test_f4_uia_integration.py

  browser-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install browser integration
        run: python -m pip install -e ".[dev,browser]"
      - name: Install Chromium
        run: python -m playwright install chromium
      - name: Real Chromium test
        run: python -m pytest -q tests/test_f3_playwright_integration.py

  windows-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Windows integration
        run: python -m pip install -e ".[dev,windows]"
      - name: Real Win32 tests
        run: python -m pytest -q tests/test_f4_win32_integration.py
      - name: Real UI Automation test
        run: python -m pytest -q tests/test_f4_uia_integration.py
