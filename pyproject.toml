[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-iron-obsidia"
version = "0.1.0"
description = "Standalone Iron-Man-style personal AI assistant"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.55,<2"]
windows = ["pywin32>=311", "pywinauto>=0.6.9"]
voice = ["faster-whisper>=1.1,<2"]
tts = ["kokoro>=0.9.4,<1", "numpy>=1.26", "soundfile>=0.12", "sounddevice>=0.5"]
wakeword = ["openwakeword==0.6.0", "numpy>=1.26"]
microphone = ["sounddevice>=0.5", "numpy>=1.26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
